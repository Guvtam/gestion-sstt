name: Pruebas Django
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar biblioteca ODBC
        run: |
          if python -c 'import ctypes; ctypes.CDLL("libodbc.so.2")'; then
            echo "Biblioteca ODBC disponible en el runner."
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update --error-on=any
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y unixodbc-dev
          fi
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check --settings=config.settings_test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - run: python manage.py test contratistas revisiones --settings=config.settings_test --verbosity=1
