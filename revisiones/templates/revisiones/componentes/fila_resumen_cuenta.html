<tr><th scope="row">{{ fila.nombre }}</th><td class="ejecutivo-cantidad-total">{{ fila.cantidad }}</td><td class="ejecutivo-col-total"><strong class="money-kpi" data-amount="{{ fila.monto|stringformat:'.2f' }}"></strong></td>{% for celda in fila.celdas %}<td{% if not celda.cantidad %} class="ejecutivo-celda-vacia"{% endif %}><strong class="money-kpi" data-amount="{{ celda.monto|stringformat:'.2f' }}"></strong><small>{{ celda.cantidad }} ODT</small></td>{% endfor %}</tr>
