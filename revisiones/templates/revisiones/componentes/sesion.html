{% if request.user.is_authenticated %}<div class="sstt-sesion">
  <span class="sstt-sesion-nombre">{{ request.user.get_full_name|default:request.user.username }}</span>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="sstt-sesion-salir">Cerrar sesión</button></form>
</div>{% endif %}
